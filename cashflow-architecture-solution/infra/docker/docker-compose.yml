version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow_postgres
    environment:
      POSTGRES_DB: cashflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cashflow_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: cashflow_redis
    ports:
      - "6379:6379"